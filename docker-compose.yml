services:
  # ============================================
  # AI Backend - FastAPI + LangGraph
  # ============================================
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stolink-ai-backend
    environment:
      # AWS Bedrock
      AWS_ACCESS_KEY_ID: ${AWS_BEDROCK_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_BEDROCK_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # RabbitMQ (Agent)
      RABBITMQ_HOST: ${RABBITMQ_AGENT_HOST}
      RABBITMQ_PORT: ${RABBITMQ_AGENT_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_AGENT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_AGENT_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_AGENT_VHOST:-stolink}
      RABBITMQ_ANALYSIS_QUEUE: stolink.analysis.queue
      # Spring Backend (external)
      SPRING_CALLBACK_URL: ${SPRING_CALLBACK_URL}
      # PostgreSQL
      POSTGRES_HOST: ${POSTGRESQL_URL}
      POSTGRES_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRES_DB: ${POSTGRESQL_DATABASE:-stolink}
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      # Neo4j
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # FastAPI
      DEBUG: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
