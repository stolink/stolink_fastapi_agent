# =============================================================================
# Docker Compose - Local Development (FastAPI Only)
# =============================================================================
# 사전 조건: stolink-shared-network 네트워크가 존재해야 함
#   docker network create stolink-shared-network
#
# 실행:
#   docker-compose -f docker-compose.local.yml up --build
#   docker-compose -f docker-compose.local.yml up --build -d  (백그라운드)
#
# 중단:
#   docker-compose -f docker-compose.local.yml down
#   docker-compose -f docker-compose.local.yml down -v  (볼륨 포함 삭제)
#
# 로그:
#   docker-compose -f docker-compose.local.yml logs -f
#   docker-compose -f docker-compose.local.yml logs -f ai-backend
#
# 재시작:
#   docker-compose -f docker-compose.local.yml restart
#
# 상태 확인:
#   docker-compose -f docker-compose.local.yml ps
# =============================================================================

version: "3.8"

services:
  # ============================================
  # AI Backend - FastAPI + LangGraph (Local Development)
  # ============================================
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stolink-fastapi-agent
    environment:
      # AWS Bedrock
      AWS_ACCESS_KEY_ID: ${AWS_BEDROCK_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_BEDROCK_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      # RabbitMQ (Spring의 AI Agent용 RabbitMQ에 연결)
      RABBITMQ_HOST: stolink-rabbitmq-agent
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: stolink
      RABBITMQ_ANALYSIS_QUEUE: stolink.analysis.queue
      # Spring Backend
      SPRING_CALLBACK_URL: http://stolink-backend:8080
      # PostgreSQL (Spring의 PostgreSQL에 연결)
      POSTGRES_HOST: stolink-postgres-local
      POSTGRES_PORT: 5432
      POSTGRES_DB: stolink
      POSTGRES_USER: stolink
      POSTGRES_PASSWORD: stolink123
      # Neo4j (Spring의 Neo4j에 연결)
      NEO4J_URI: bolt://stolink-neo4j-local:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: stolink123
      # FastAPI
      FASTAPI_PORT: 8001
      DEBUG: "true"
    ports:
      - "8001:8001"
    networks:
      - stolink-shared-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  stolink-shared-network:
    external: true
