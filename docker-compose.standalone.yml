# =============================================================================
# Docker Compose - Standalone (Full Stack)
# =============================================================================
# PostgreSQL, Neo4j, RabbitMQ, FastAPI 전체 스택 실행
#
# 실행:
#   docker-compose -f docker-compose.standalone.yml up --build
#   docker-compose -f docker-compose.standalone.yml up --build -d  (백그라운드)
#
# 중단:
#   docker-compose -f docker-compose.standalone.yml down
#   docker-compose -f docker-compose.standalone.yml down -v  (볼륨 포함 삭제)
#
# 로그:
#   docker-compose -f docker-compose.standalone.yml logs -f
#   docker-compose -f docker-compose.standalone.yml logs -f ai-backend
#   docker-compose -f docker-compose.standalone.yml logs -f postgres
#   docker-compose -f docker-compose.standalone.yml logs -f neo4j
#   docker-compose -f docker-compose.standalone.yml logs -f rabbitmq
#
# 재시작:
#   docker-compose -f docker-compose.standalone.yml restart
#   docker-compose -f docker-compose.standalone.yml restart ai-backend
#
# 상태 확인:
#   docker-compose -f docker-compose.standalone.yml ps
#
# 개별 서비스 실행:
#   docker-compose -f docker-compose.standalone.yml up -d postgres neo4j rabbitmq
# =============================================================================

services:
  # ============================================
  # PostgreSQL - Primary Data Store
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stolink-postgres
    environment:
      POSTGRES_DB: stolink
      POSTGRES_USER: stolink
      POSTGRES_PASSWORD: stolink123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stolink -d stolink" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stolink-network

# ============================================
  # Neo4j - Graph Database for Character Relations
  # ============================================
  neo4j:
    image: neo4j:5.26-community
    container_name: stolink-neo4j
    environment:
      NEO4J_AUTH: neo4j/stolink123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stolink-network

  # ============================================
  # RabbitMQ - Message Queue
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stolink-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: stolink
      RABBITMQ_DEFAULT_PASS: stolink123
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stolink-network

  # ============================================
  # Redis - Embedding Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: stolink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stolink-network

  # ============================================
  # AI Backend - FastAPI + LangGraph
  # ============================================
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stolink-fastapi-agent
    environment:
      # Google Gemini (primary LLM)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # AWS Bedrock (deprecated)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: us-east-1
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: stolink
      RABBITMQ_PASSWORD: stolink123
      RABBITMQ_VHOST: /
      # Document Analysis Architecture
      DOCUMENT_ANALYSIS_QUEUE: document_analysis_queue
      GLOBAL_MERGE_QUEUE: global_merge_queue
      CONSUMER_PREFETCH_COUNT: 20 # Increased for better throughput
      # Spring Backend (external)
      SPRING_BACKEND_URL: ${SPRING_BACKEND_URL:-http://host.docker.internal:8080}
      SPRING_CALLBACK_URL: ${SPRING_CALLBACK_URL:-http://stolink-backend:8080}
      # PostgreSQL
      POSTGRES_HOST: stolink-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: stolink
      POSTGRES_USER: stolink
      POSTGRES_PASSWORD: stolink123
      # Neo4j
      NEO4J_URI: bolt://stolink-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: stolink123
      # Redis (Embedding Cache)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # FastAPI
      DEBUG: "true"
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stolink-network
    restart: unless-stopped

networks:
  stolink-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
  redis_data:
  mysql_data:
